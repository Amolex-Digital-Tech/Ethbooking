name: Booking and Search Checks

on:
  push:
  pull_request:

jobs:
  verify:
    name: Prisma, TypeScript, and deployment builds
    runs-on: ubuntu-latest
    timeout-minutes: 35

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/ethiopianbooking?schema=public
      NEXT_PUBLIC_SUPABASE_URL: https://example.supabase.co
      NEXT_PUBLIC_SUPABASE_PUBLISHABLE_KEY: ci-placeholder-key
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      CHAPA_SECRET_KEY: ci-placeholder-secret
      CHAPA_WEBHOOK_SECRET: ci-placeholder-webhook-secret

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies and generate Prisma Client
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate --config prisma7.config.ts

      - name: Validate Prisma schema
        run: npx prisma validate --config prisma7.config.ts

      - name: Check TypeScript
        run: npx tsc --noEmit

      - name: Lint
        run: npm run lint

      - name: Run unit tests
        run: npm test

      - name: Build Next.js production application
        run: npm run build

      - name: Build Cloudflare OpenNext Worker
        run: npx opennextjs-cloudflare build
