name: Expire unpaid bookings

# Releases rooms held by unpaid bookings every 5 minutes.
#
# Vercel's Hobby plan only allows cron jobs that run once a day, so the
# frequent schedule runs here and vercel.json keeps a daily run as a backup.
#
# Setup (repository Settings → Secrets and variables → Actions):
#   - secret   CRON_SECRET: the same value as the app's CRON_SECRET env var
#   - variable SITE_URL:    the production URL, e.g. https://example.com
#
# GitHub may delay scheduled runs by several minutes. Bookings are also
# expired when a customer opens them, so a delay is not harmful.

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

concurrency:
  group: expire-bookings
  cancel-in-progress: false

permissions: {}

jobs:
  expire:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Call the booking expiry endpoint
        env:
          SITE_URL: ${{ vars.SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$SITE_URL" ] || [ -z "$CRON_SECRET" ]; then
            echo "::warning::SITE_URL variable or CRON_SECRET secret is not set; skipping."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --header "Authorization: Bearer $CRON_SECRET" \
            "${SITE_URL%/}/api/cron/expire-bookings"
